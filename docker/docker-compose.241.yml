name: superwork-bu

services:
  mysql:
    image: mysql:8.0
    container_name: superwork-bu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD required}
      MYSQL_DATABASE: bu_management
      MYSQL_USER: bu_admin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u bu_admin -p\"$$MYSQL_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - bu-network

  redis:
    image: redis:7-alpine
    container_name: superwork-bu-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - bu-network

  minio:
    image: minio/minio:latest
    container_name: superwork-bu-minio
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD required}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"
    networks:
      - bu-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.runtime
    container_name: superwork-bu-backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/doc.html"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bu_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: bu_admin
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: bu_management
      MYSQL_USER: bu_admin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ""
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY required}
      AI_SIDECAR_URL: http://ai-sidecar:8787
      AI_SIDECAR_TOKEN: ${AI_SIDECAR_TOKEN:-dev-sidecar-token}
      AI_SIDECAR_TOOL_CALLBACK_URL: http://backend:8081/internal/ai-agent/tools
      PROJECT_CONTEXT_TOKEN: ${PROJECT_CONTEXT_TOKEN:-}
      # 任务编排灰度：总开关 + 用户 ID 名单（为空时入口一律 403）
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-false}
      AI_AGENT_GRAY_USER_IDS: ${AI_AGENT_GRAY_USER_IDS:-}
      # 企微 HTTP 回调（可选；三项都配置才启用）
      WECOM_CALLBACK_TOKEN: ${WECOM_CALLBACK_TOKEN:-}
      WECOM_CALLBACK_AES_KEY: ${WECOM_CALLBACK_AES_KEY:-}
      WECOM_CALLBACK_CORP_ID: ${WECOM_CALLBACK_CORP_ID:-}
      PROJECT_BRIEF_PUSH_ENABLED: ${PROJECT_BRIEF_PUSH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      YUNXIAO_ENABLED: ${YUNXIAO_ENABLED:-false}
      YUNXIAO_EDITION: ${YUNXIAO_EDITION:-center}
      YUNXIAO_BASE_URL: ${YUNXIAO_BASE_URL:-https://openapi-rdc.aliyuncs.com}
      YUNXIAO_ORGANIZATION_ID: ${YUNXIAO_ORGANIZATION_ID:-}
      YUNXIAO_TOKEN: ${YUNXIAO_TOKEN:-}
      YUNXIAO_CONFIG_ENCRYPTION_KEY: ${YUNXIAO_CONFIG_ENCRYPTION_KEY:-}
      EMAIL_CREDENTIAL_ENCRYPTION_KEY: ${EMAIL_CREDENTIAL_ENCRYPTION_KEY:-}
      EMAIL_SYNC_CRON: ${EMAIL_SYNC_CRON:-0 0 * * * *}
      EMAIL_DIGEST_CRON: ${EMAIL_DIGEST_CRON:-0 0 8 * * *}
      MEETING_STORAGE_DIR: /data/meetings
      AI_ATTACHMENT_STORAGE_DIR: /data/ai-agent-attachments
      WECOM_CLI_BIN: /app/wecom-cli/wecom-cli
      WECOM_CLI_CONFIG_DIR: /data/wecom-cli
    volumes:
      - ./data/meetings:/data/meetings
      - ./data/ai-agent-attachments:/data/ai-agent-attachments
      - ./data/project-facts:/data/project-facts
      - ./data/wecom-cli:/data/wecom-cli
    ports:
      - "18081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - bu-network

  ai-sidecar:
    build:
      context: ../ai-sidecar
      dockerfile: Dockerfile
    container_name: superwork-bu-ai-sidecar
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      SIDECAR_TOKEN: ${AI_SIDECAR_TOKEN:-dev-sidecar-token}
      # 企微智能机器人长连接（入站消息→后端）；关闭时 sidecar 不建连，不影响 AI 助手
      AIBOT_ENABLED: "true"
      BACKEND_BASE_URL: http://backend:8081
      PROJECT_CONTEXT_TOKEN: ${PROJECT_CONTEXT_TOKEN:-}
    networks:
      - bu-network

  # 会议转写 worker（FunASR）：仅 bu-network 内网，不发布宿主端口；
  # backend 经系统配置 meeting.asr.base-url=http://asr-worker:8790 访问。
  asr-worker:
    build:
      context: ../asr-worker
      dockerfile: Dockerfile
    container_name: superwork-bu-asr-worker
    restart: unless-stopped
    environment:
      MODEL_DIR: /models
      MEETING_TOKEN: ${MEETING_ASR_TOKEN:-}
    volumes:
      - ./asr-models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8790/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - bu-network

  # 出口代理（mihomo，订阅节点）：默认直连，仅 typesafe.ai / b.ai 等被墙域名走节点。
  # 连接器在 extra.proxy=http://mihomo:7890 时经此前代（CONNECT 隧道，TLS 端到端）；仅 bu-network 内网，不发布宿主端口。
  mihomo:
    build:
      context: ./mihomo
    container_name: superwork-bu-mihomo
    restart: unless-stopped
    volumes:
      - ./mihomo:/root/.config/mihomo
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7890"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bu-network

  frontend-pro:
    build:
      context: ../frontend-pro
      dockerfile: Dockerfile
    container_name: superwork-bu-frontend-pro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bu-network
  nginx:
    image: nginx:alpine
    container_name: superwork-bu-nginx
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/241.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - backend
      - frontend-pro
    networks:
      - bu-network

networks:
  bu-network:
    name: superwork-bu-network
    driver: bridge
