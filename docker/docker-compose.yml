version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bu-management-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: bu_management
      MYSQL_USER: bu_admin
      MYSQL_PASSWORD: bu_admin123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bu_admin", "-pbu_admin123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - bu-network

  redis:
    image: redis:7-alpine
    container_name: bu-management-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - bu-network

  minio:
    image: minio/minio:latest
    container_name: bu-management-minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data:/data
    command: server /data --console-address ":9001"
    networks:
      - bu-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bu-management-frontend
    restart: always
    ports:
      - "8080:80"
    networks:
      - bu-network

  # ai-sidecar 回调宿主机上运行的 backend(8081): 启动宿主 backend 时需设置
  # AI_SIDECAR_TOOL_CALLBACK_URL=http://host.docker.internal:8081/internal/ai-agent/tools

  ai-sidecar:
    build:
      context: ../ai-sidecar
      dockerfile: Dockerfile
    container_name: bu-management-ai-sidecar
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      SIDECAR_TOKEN: ${AI_SIDECAR_TOKEN:-dev-sidecar-token}
    networks:
      - bu-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: bu-management-nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
    networks:
      - bu-network

networks:
  bu-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  minio-data:
